<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>METALHIVE · hoja de sprites</title>
<style>body{margin:0;background:#1a120e;color:#c9b38e;font:12px sans-serif}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Vista de inspección: nave en sus 9 frames de rolido y enemigos (con placas desmontadas)
import * as ART from './src/art.js';
const ship = ART.buildShipFrames(9), en = ART.buildEnemySprites();
const c = document.getElementById('c'), g = c.getContext('2d');
c.width = 1100; c.height = 520;
g.fillStyle = '#1a120e'; g.fillRect(0, 0, c.width, c.height);
g.fillStyle = '#c9b38e'; g.fillText('Nave: rolido -1 … +1 (escala 1.8x)  ·  abajo: tamaño real en juego', 10, 16);
ship.forEach((s, i) => ART.drawSprite(g, s, 60 + i * 120, 110, 1.8));
ship.forEach((s, i) => ART.drawSprite(g, s, 60 + i * 120, 230, 1));
g.fillText('Enemigos (2x): Aguijón · Tábano · Escarabajo (completo / sin placa izq / sin der / sin ambas)', 10, 300);
ART.drawSprite(g, en.stinger, 60, 400, 2);
ART.drawSprite(g, en.tabano, 180, 400, 2);
en.beetle.forEach((s, i) => ART.drawSprite(g, s, 340 + i * 140, 400, 2));
</script></body></html>
